<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Marrengula IT ERP</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { 
      font-family: 'Segoe UI', system-ui, sans-serif; 
      background: linear-gradient(135deg, #1e3a5f 0%, #0d1b2a 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .container {
      background: white;
      padding: 40px;
      border-radius: 16px;
      box-shadow: 0 25px 50px rgba(0,0,0,0.3);
      text-align: center;
      max-width: 500px;
    }
    h1 { color: #1e3a5f; margin-bottom: 10px; font-size: 28px; }
    .subtitle { color: #666; margin-bottom: 30px; }
    .btn {
      display: inline-block;
      padding: 15px 40px;
      background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
      color: white;
      text-decoration: none;
      border-radius: 8px;
      font-weight: 600;
      font-size: 16px;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 25px rgba(37, 99, 235, 0.4);
    }
    .info {
      margin-top: 30px;
      padding: 20px;
      background: #f8fafc;
      border-radius: 8px;
      font-size: 14px;
      color: #64748b;
    }
    .info strong { color: #1e3a5f; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Marrengula IT ERP</h1>
    <p class="subtitle">Sistema de Gestão para Bar e Restaurante</p>
    
    <a href="http://localhost:8080" class="btn">Abrir Sistema</a>
    
    <div class="info">
      <p><strong>Versão:</strong> 1.0.0</p>
      <p><strong>Desenvolvedor:</strong> Marrengula IT</p>
      <p style="margin-top: 10px; color: #ef4444;"><strong>Nota:</strong> O servidor deve estar em execução</p>
      <p style="margin-top: 10px;">Para iniciar: <code>npm run dev</code></p>
    </div>
  </div>
</body>
</html>
